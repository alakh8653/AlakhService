version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /services/*
      - /backend
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/shop_dashboard_web
    schedule:
      interval: weekly
    groups:
      npm-deps:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/admin_dashboard_web
    schedule:
      interval: weekly
    groups:
      npm-deps:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /apps/mobile_app
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /services/*
      - /backend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
