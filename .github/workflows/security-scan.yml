name: Security Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # required to upload SARIF results to code scanning
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  # Fails on a known hole that has a fix, unlike Trivy above, which only reports to the Security tab.
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Audit Node packages
        run: |
          for dir in apps/shop_dashboard_web apps/admin_dashboard_web services/api_gateway; do
            (cd "$dir" && npm audit --omit=dev --package-lock-only --audit-level=high)
          done
      - name: Audit Python packages
        # Both ignored ones were checked and do not reach us. PYSEC-2026-4298 needs a public key used as an HS256
        # secret, and every service fixes algorithms=[HS256] with a shared secret. PYSEC-2026-1325 is a timing attack
        # on ECDSA signing, which nothing here does. Neither has a fixed version yet.
        run: |
          pip install pip-audit
          for req in services/*/requirements.txt; do
            case "$req" in */catalog_service/*|*/dispatch_service/*) continue ;; esac
            pip-audit -r "$req" --progress-spinner off --ignore-vuln PYSEC-2026-4298 --ignore-vuln PYSEC-2026-1325
          done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # On push, scan only the pushed commits; on the weekly schedule, scan the full history.
      # (base: main / head: HEAD resolved to the same commit on main, so nothing was scanned and the job failed.)
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          head: ${{ github.event_name == 'push' && github.sha || '' }}
