name: Mobile CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/mobile_app/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/mobile_app/**"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"
  JAVA_VERSION: "17"

jobs:
  # ---------------------------------------------------------------------------
  # Analyze & Test
  # ---------------------------------------------------------------------------
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate mocks
        run: dart run build_runner build

      - name: Analyze (flutter analyze)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run unit, widget & integration tests
        run: |
          flutter test \
            --coverage \
            --reporter=expanded

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flutter-coverage
          path: apps/mobile_app/coverage/lcov.info
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Build Android APK (release; signed with the release keystore when the
  # ANDROID_KEYSTORE_* secrets are set, otherwise with the debug key)
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not set; the APK will be signed with the debug key."
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "ANDROID_KEYSTORE_PATH=$keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: flutter build apk --release

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: apps/mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Build iOS (compile check, no code signing)
  # ---------------------------------------------------------------------------
  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    needs: test
    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign
