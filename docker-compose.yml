# =============================================================================
# AlakhService — Docker Compose Orchestration
# Starts PostgreSQL, Redis and every Python microservice for local development.
#
#   docker compose up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build   # hot reload
#
# Each service gets its own database (created by infra/postgres/init-databases.sql)
# and creates its tables on start-up, since the services do not ship migrations yet.
# =============================================================================

x-python-service: &python-service
  restart: unless-stopped
  networks:
    - alakhservice_network
  env_file:
    - path: .env
      required: false
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 20s
  command:
    - sh
    - -c
    - |
      python - <<'PY'
      import asyncio, importlib, pkgutil
      import app.main  # noqa: F401
      import app.models as models
      from app.database import Base, engine
      for mod in pkgutil.walk_packages(models.__path__, "app.models."):
          importlib.import_module(mod.name)
      async def create_tables():
          async with engine.begin() as conn:
              await conn.run_sync(Base.metadata.create_all)
          await engine.dispose()
      asyncio.run(create_tables())
      PY
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 $${UVICORN_EXTRA_ARGS:-}

x-service-env: &service-env
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-changeme}
  ENVIRONMENT: ${ENVIRONMENT:-development}

services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: alakh_postgres
    restart: unless-stopped
    networks:
      - alakhservice_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alakh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alakhpassword}
      POSTGRES_DB: ${POSTGRES_DB:-alakhservice_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alakh} -d ${POSTGRES_DB:-alakhservice_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: alakh_redis
    restart: unless-stopped
    networks:
      - alakhservice_network
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Microservices (each listens on 8000 inside the network)
  # ---------------------------------------------------------------------------

  auth_service:
    <<: *python-service
    container_name: alakh_auth_service
    build:
      context: ./services/auth_service
    ports:
      - "${AUTH_SERVICE_PORT:-8001}:8000"
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-alakh}:${POSTGRES_PASSWORD:-alakhpassword}@postgres:5432/auth_db
      REDIS_URL: redis://redis:6379/0

