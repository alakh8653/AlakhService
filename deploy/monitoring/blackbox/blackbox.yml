# Blackbox exporter modules used by deploy/monitoring/prometheus/prometheus.yml.
modules:
  # Internal readiness checks (plain HTTP inside the Docker network).
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200]
      preferred_ip_protocol: ip4

  # The public sites through Caddy: must be HTTPS with a valid certificate.
  https_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4
