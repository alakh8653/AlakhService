name: Mobile CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/mobile_app/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/mobile_app/**"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  # ---------------------------------------------------------------------------
  # Analyze & Test
  #
  # Release builds (APK / iOS) are not run yet: apps/mobile_app has no generated
  # android/ or ios/ platform projects. Add them with
  # `flutter create --platforms=android,ios .` and then add build jobs here.
  # ---------------------------------------------------------------------------
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate mocks
        run: dart run build_runner build

      - name: Analyze (flutter analyze)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run unit, widget & integration tests
        run: |
          flutter test \
            --coverage \
            --reporter=expanded

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flutter-coverage
          path: apps/mobile_app/coverage/lcov.info
          retention-days: 14
