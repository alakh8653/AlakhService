# Alert rules for AlakhService. Each alert says what is wrong and what to look at first;
# the runbook column in docs/DEPLOYMENT.md ("Monitoring") has the longer version.
groups:
  - name: availability
    rules:
      - alert: ServiceDown
        expr: probe_success{job="services"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} is not ready"
          description: >-
            {{ $labels.instance }} has failed its readiness check for 2 minutes (its database or Redis
            may be unreachable, or it crashed). Check: make prod-logs S={{ $labels.service }}

      - alert: GatewayMetricsDown
        expr: up{job="gateway"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus cannot scrape the API gateway"
          description: >-
            The gateway is down or METRICS_TOKEN no longer matches. Check: make prod-logs
            S=api_gateway

      - alert: PublicSiteDown
        expr: probe_success{job="public"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is unreachable from the internet side"
          description: >-
            The HTTPS check through Caddy has failed for 5 minutes (Caddy down, certificate problem or
            DNS). Check: make prod-logs S=caddy

      - alert: CertificateExpiresSoon
        expr: probe_ssl_earliest_cert_expiry{job="public"} - time() < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "HTTPS certificate for {{ $labels.instance }} expires in under 14 days"
          description: >-
            Caddy renews certificates 30 days before expiry, so renewal is failing. Check DNS and:
            make prod-logs S=caddy

  - name: gateway
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum by (upstream) (rate(gateway_http_requests_total{status=~"5.."}[5m]))
            /
            sum by (upstream) (rate(gateway_http_requests_total[5m]))
          ) > 0.05
          and sum by (upstream) (rate(gateway_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.upstream }}: {{ $value | humanizePercentage }} of requests fail with 5xx"
          description: >-
            More than 5% server errors for 5 minutes. Check: make prod-logs S={{ $labels.upstream }}

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le, upstream) (rate(gateway_http_request_duration_seconds_bucket[5m]))
          ) > 2
          and sum by (upstream) (rate(gateway_http_request_duration_seconds_count[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.upstream }}: 95% of requests take up to {{ $value | humanizeDuration }}"
          description: >-
            p95 latency above 2 s for 10 minutes. Look at server load (make prod-status, docker stats)
            and the database.

      - alert: CircuitOpen
        expr: max by (upstream) (gateway_circuit_open) == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Gateway stopped sending requests to {{ $labels.upstream }}"
          description: >-
            The circuit breaker opened after repeated failures; requests to it get 503 until it
            recovers. Check: make prod-logs S={{ $labels.upstream }}

      - alert: RedisErrors
        expr: increase(gateway_redis_errors_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The gateway cannot reach Redis"
          description: >-
            Rate limits and sign-out checks are being skipped (requests are let through). Check: make
            prod-logs S=redis

  - name: live_queue
    # From booking_service's /metrics (job "booking"); docs/LIVE_QUEUE.md §12.
    rules:
      - alert: QueueSlow
        expr: |
          histogram_quantile(0.95,
            sum by (le, endpoint) (rate(alakh_queue_request_seconds_bucket[5m]))
          ) > 0.3
          and sum by (endpoint) (rate(alakh_queue_request_seconds_count[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Live queue ({{ $labels.endpoint }}): 95% of requests take up to {{ $value | humanizeDuration }}"
          description: >-
            Each look recomputes the shop's day; above 300 ms for 10 minutes a shop's line is very long
            or the database is slow. Check: make prod-logs S=booking_service, and the database load.

      - alert: QueueNotificationsFailing
        expr: |
          (
            sum(rate(alakh_booking_notifications_total{event=~"booking\\.(your_turn|turn_soon|queue_update|queue_ahead)",outcome!="sent"}[10m]))
            /
            sum(rate(alakh_booking_notifications_total{event=~"booking\\.(your_turn|turn_soon|queue_update|queue_ahead)"}[10m]))
          ) > 0.05
          and sum(rate(alakh_booking_notifications_total{event=~"booking\\.(your_turn|turn_soon|queue_update|queue_ahead)"}[10m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value | humanizePercentage }} of queue messages do not reach notification_service"
          description: >-
            Customers are not told their turn is coming. Check: make prod-logs S=notification_service, then
            make prod-logs S=booking_service (notify_failed, notify_rejected).

      - alert: BookingWorkerSlow
        expr: |
          increase(alakh_booking_worker_pass_seconds_count[10m])
            - ignoring(le) increase(alakh_booking_worker_pass_seconds_bucket{le="20"}[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Booking worker passes take longer than 20 s"
          description: >-
            The every-minute pass (queue notices, reminders, expiries) is falling behind, so queue messages
            arrive late. Look at how many shops have a line today and the database load.

      - alert: BookingWorkerStopped
        expr: |
          time() - alakh_booking_worker_last_pass_timestamp_seconds > 5 * 60
          and alakh_booking_worker_last_pass_timestamp_seconds > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No good booking worker pass for {{ $value | humanizeDuration }}"
          description: >-
            No queue notices, reminders or expiries are going out; every pass is failing. Check: make
            prod-logs S=booking_service (booking_worker_failed).

      - alert: QueueWaitsOff
        expr: |
          sum by (shop_id) (increase(alakh_queue_start_error_minutes_total[1d]))
            / sum by (shop_id) (increase(alakh_queue_starts_measured_total[1d])) > 15
          and sum by (shop_id) (increase(alakh_queue_starts_measured_total[1d])) >= 10
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Shop {{ $labels.shop_id }}: starts are {{ $value | humanize }} min from what customers were told"
          description: >-
            Over the last day this shop's customers started on average more than 15 minutes from the time
            they were last given. Its service lengths or team are probably out of date; ask the shop to
            check them (the queue learns lengths, but slowly from a far-off start).

  - name: server
    rules:
      - alert: BackupTooOld
        # Two daily backups missed (adjust if you change BACKUP_INTERVAL_HOURS).
        expr: time() - alakh_backup_last_success_timestamp_seconds > 50 * 3600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "No verified database backup for {{ $value | humanizeDuration }}"
          description: >-
            The backup service is failing or stopped. Check: make prod-logs S=backup, then make
            prod-backup

      - alert: BackupMetricMissing
        expr: absent(alakh_backup_last_success_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Backup age is not being reported"
          description: "The backup_metrics or node_exporter container is not running (make prod-status)."

      - alert: DiskAlmostFull
        expr: |
          node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} < 0.15
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Less than 15% disk space left on the server"
          description: >-
            PostgreSQL stops when the disk is full. Free space: docker image prune -a, old backups, or
            grow the disk.

      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Less than 10% memory available on the server"
          description: >-
            Services may be killed for lack of memory. See docker stats; consider a bigger server.
